name: release

# PyInstaller cannot cross-compile, so each platform builds on its own native runner.
#   push a tag like v1.0.1  -> build Windows + Linux, then publish a GitHub Release
#   manual run (Actions tab) -> build only; grab the files from the run's artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read              # least privilege; only the release job gets write access

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 on purpose: a PyInstaller bundle needs glibc >= the build machine's.
          # Building on an older image (glibc 2.35) runs on more distros than ubuntu-latest.
          - { os: ubuntu-22.04,   shell: bash, build: "./build.sh", files: "dist/*.tar.gz" }
          - { os: windows-latest, shell: cmd,  build: "build.bat",  files: "dist/*.zip" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"            # pinned: the same Python on both platforms

      - name: Install Tk (Linux only; Windows Python ships it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Tag must match core/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(python packaging/info.py version)" = "$GITHUB_REF_NAME"

      - name: Build (same script you run locally)
        shell: ${{ matrix.shell }}
        run: ${{ matrix.build }}

      # upload-artifact and download-artifact majors are a pair: bump them together
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')      # manual test builds never publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write                               # needed to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true                      # both platforms' files into one folder

      - name: Checksums
        run: cd out && sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
