name: release

# PyInstaller cannot cross-compile, so each platform builds on its own native runner.
#   push a tag like v1.2.0  -> build everything, then publish a GitHub Release
#   manual run (Actions tab) -> build only; grab the files from the run's artifacts
# Release files: Windows setup .exe + portable .zip, Linux .deb + .rpm + .tar.gz, SHA256SUMS
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 on purpose: a PyInstaller bundle needs glibc >= the build machine's.
          # Building on an older image (glibc 2.35) runs on more distros than ubuntu-latest.
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk and rpm tooling (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk rpm

      - name: Verify tag matches core/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(python packaging/info.py version)" = "$GITHUB_REF_NAME"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call build.bat

      - name: Linux packages (.deb and .rpm)
        if: runner.os == 'Linux'
        run: bash packaging/build-deb.sh && bash packaging/build-rpm.sh

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = python packaging/info.py version
          & $iscc "/DAppVersion=$v" packaging\windows\installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        run: cd out && sha256sum *.zip *.tar.gz *.deb *.rpm *.exe > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
